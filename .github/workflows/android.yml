name: Android APK
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Android SDK
        run: |
          set -o pipefail
          sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0' 2>&1 | tee sdk.log || { tail -40 sdk.log | while IFS= read -r line; do echo "::error::$line"; done; exit 1; }
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Crear clave de depuración temporal
        run: keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
      - name: Ejecutar pruebas y compilar APK de depuración
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle.log || { tail -100 gradle.log | while IFS= read -r line; do echo "::error::$line"; done; exit 1; }
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
