name: Android APK
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar Android SDK
        run: |
          set -o pipefail
          {
            echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
            SDK="${ANDROID_HOME:-$HOME/android-sdk}"
            echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
            if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
              mkdir -p "$SDK/cmdline-tools"
              curl -fSL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o /tmp/android-tools.zip
              unzip -q /tmp/android-tools.zip -d "$SDK/cmdline-tools"
              mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            fi
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36.1' 'build-tools;36.0.0'
          } 2>&1 | tee sdk.log || { tail -40 sdk.log | while IFS= read -r line; do echo "::error::$line"; done; exit 1; }
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Crear clave de depuración temporal
        run: keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
      - name: Ejecutar pruebas y compilar APK de depuración
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:testDebugUnitTest --no-daemon 2>&1 | tee gradle.log || {
            python3 -c 'import glob,xml.etree.ElementTree as ET; files=glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml"); [print("::error::" + str(t.get("classname")) + "." + str(t.get("name")) + " " + str((t.find("failure").get("message") or "")[:500])) for f in files for t in ET.parse(f).iter("testcase") if t.find("failure") is not None]'
            grep -E -A 4 'FAILURE:|^e: |Execution failed for task' gradle.log | head -5 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - name: Publicar APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
